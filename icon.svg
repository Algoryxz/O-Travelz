<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1F293D" stroke-width="8"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#14B8A6" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="160" fill="#172235" stroke="#263244" stroke-width="4"/>

  <!-- Konark Sun Chariot & Compass Star Geometry -->
  <g transform="translate(256, 256)">
    <!-- 8 Compass Spokes -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
    <line x1="-99" y1="-99" x2="99" y2="99" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <line x1="-99" y1="99" x2="99" y2="-99" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>

    <!-- Temple Shikhara Spire Motif -->
    <path d="M 0 -120 L 40 40 L 0 20 L -40 40 Z" fill="url(#tealGrad)"/>
    <path d="M 0 -120 L 0 20 L 40 40 Z" fill="#0D9488" opacity="0.6"/>

    <!-- Southern Star / Pointer -->
    <path d="M 0 120 L 25 30 L 0 20 L -25 30 Z" fill="url(#goldGrad)"/>

    <!-- Central Core Hub -->
    <circle cx="0" cy="0" r="32" fill="#0B1220" stroke="#14B8A6" stroke-width="6"/>
    <circle cx="0" cy="0" r="14" fill="url(#tealGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
  </g>
</svg>
