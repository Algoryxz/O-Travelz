services:
  # ---------------------------------------------------------------------------
  # 1. O-TRAVELZ BACKEND WEB SERVICE (FastAPI + PostGIS + Python 3.12)
  # ---------------------------------------------------------------------------
  - type: web
    name: otravelz-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: otravelz-images-disk
      mountPath: /app/data/images
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_FRONTEND_REDIRECT_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_BASE_PATH
        value: /app/data/images
      - key: AI_PROVIDER
        value: multi_provider
      - key: AI_ALLOW_EXTERNAL_PROVIDER
        value: "true"
      - key: AI_ALLOW_PAID_PROVIDER
        value: "false"
      - key: AI_FALLBACK_PROVIDER
        value: rule_based
      - key: GOOGLE_OAUTH_ENABLED
        value: "false"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_AZURE_DEPLOYMENT_NAME
        value: gpt-4o-mini
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: AI_NVIDIA_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. O-TRAVELZ FRONTEND STATIC SITE (React 18 + Vite + Tailwind 4)
  # ---------------------------------------------------------------------------
  - type: static
    name: otravelz-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
