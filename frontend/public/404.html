<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>O-Travelz - Odisha Cultural Atlas</title>
    <script type="text/javascript">
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?path=' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
