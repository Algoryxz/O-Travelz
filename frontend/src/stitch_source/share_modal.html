<!DOCTYPE html>

<button class="text-text-muted hover:text-text-primary transition-colors p-2 rounded-full hover:bg-surface">

<label class="text-sm font-medium text-text-secondary">Link Visibility</label>
<div class="flex items-center space-x-2 bg-surface p-1 rounded-lg">

<input class="w-full pl-10 pr-24 py-3 bg-surface border border-border rounded-lg text-sm font-mono text-text-secondary focus:outline-none focus:ring-1 focus:ring-accent-primary focus:border-accent-primary" readonly="" type="text" value="https://o-travelz.com/i/orissa-heritage-7a9f"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 px-4 py-1.5 bg-text-primary text-card text-xs font-medium rounded-lg hover:bg-text-secondary transition-colors">

</div>
<span class="text-xs font-medium text-text-secondary group-hover:text-accent-primary transition-colors">Scan to open on mobile</span>
</div>

<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-border hover:bg-surface hover:border-text-secondary transition-all group">

<span class="text-[10px] font-medium text-text-muted group-hover:text-text-primary">WhatsApp</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-border hover:bg-surface hover:border-text-secondary transition-all group">
<span class="material-symbols-outlined text-text-secondary group-hover:text-text-primary text-2xl mb-2">mail</span>
<span class="text-[10px] font-medium text-text-muted group-hover:text-text-primary">Email</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-border hover:bg-surface hover:border-text-secondary transition-all group">
<span class="material-symbols-outlined text-text-secondary group-hover:text-text-primary text-2xl mb-2">alternate_email</span>
<span class="text-[10px] font-medium text-text-muted group-hover:text-text-primary">Twitter/X</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-border hover:bg-surface hover:border-text-secondary transition-all group">
<span class="material-symbols-outlined text-text-secondary group-hover:text-text-primary text-2xl mb-2">account_balance_wallet</span>
<span class="text-[10px] font-medium text-text-muted group-hover:text-text-primary">Apple Wallet</span>
