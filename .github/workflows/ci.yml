name: O-Travelz CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-integrity:
    name: Repository Integrity & Whitespace Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Git Diff and Formatting
        run: |
          git diff --check

  backend-ci:
    name: Backend Test, Migration & Compilation Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_odisha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_odisha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: backend:.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
      SESSION_SECRET_KEY: ci-test-session-secret-key-for-automated-pipeline-only-32bytes
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-automated-pipeline-only-32bytes
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Bytecode Compilation
        run: |
          python -m compileall backend scripts

      - name: Validate Alembic Migration History
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
        run: |
          alembic -c backend/alembic.ini heads

      - name: Apply Database Migrations (Upgrade Head)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Seed Authoritative Database & Verify Invariants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
        run: |
          python scripts/bootstrap_database.py

      - name: Run Full Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
        run: |
          python -m pytest backend/tests -q

      - name: Run Auth & Security Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_odisha
        run: |
          python -m pytest backend/tests/test_auth_*.py -q

  frontend-ci:
    name: Frontend Vitest, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Full Vitest Suite
        run: |
          npm --prefix frontend test -- --run

      - name: Run Production Build (tsc && vite build)
        run: |
          npm --prefix frontend run build
